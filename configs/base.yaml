# Defaults shared by every experiment. Experiment files list this under `_base_` and
# override what they change. Component sections take `name:` plus that component's kwargs.
seed: 0

data:
  revision: null        # HF tag of mhtable-data, e.g. data-v1; null = latest (dev only)
  tier: relaxed         # strict | relaxed
  sources: [spider, mmqa]

env:
  horizon: 5
  budget_tokens: 4096
  tier: relaxed         # strict | relaxed (also selects which instances are used)
  edges: inferred       # inferred | declared
  edge_threshold: 0.6667  # min omega for inferred joins; keeps 98% of gold joins on train
  episode_tables: all   # all tables of the database; "gold_plus_k" is a later ablation
  tokenizer: null       # budget counted in: null = 3.5 chars/token | a model name | reader (= reader.model)

reader:
  name: mock            # debugging only (needs gold); real readers: hf | vllm (configs/experiments/eval.yaml)

encoder:
  name: hash            # lexical stand-in for tests and smoke runs
  dim: 64
  # real encoder: a frozen cache built by `python -m mhtable.encoders.build_cache`, e.g.
  # cache: hf:embeddings/bge-m3/spider_mmqa.npz    (a list loads several families)

featurise:
  header_ablation: false  # true: table/column names -> table_i / col_j (robustness study)

policy:
  name: mlp
  d: 256
  hidden: 512

algo:
  name: ppo

train:
  device: auto          # auto = GPU if the installed torch build has CUDA, else CPU | cpu | cuda

reward:
  variant: R1           # R0 sparse | R1 shaped
  beta: 0.5
  lambda_cost: 0.1
  coverage: 0.0         # R_ans = (1 - coverage) * EM + coverage * sufficient (rewards.py); 0 = EM only

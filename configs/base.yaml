# Defaults shared by every experiment. Experiment files list this under `_base_` and
# override what they change. Component sections take `name:` plus that component's kwargs.
seed: 0

data:
  revision: null        # HF tag of mhtable-data, e.g. data-v1; null = latest (dev only)
  tier: relaxed         # strict | relaxed
  sources: [spider, mmqa]

env:
  horizon: 5
  budget_tokens: 4096
  tier: relaxed         # strict | relaxed (also selects which instances are used)
  edges: inferred       # inferred | declared
  edge_threshold: 0.6667  # min omega for inferred joins; keeps 98% of gold joins on train
  episode_tables: all   # all tables of the database; "gold_plus_k" is a later ablation

reader:
  name: mock

policy:
  name: mlp
  d: 256

algo:
  name: ppo

reward:
  variant: R1           # R0 sparse | R1 shaped
  beta: 0.5
  lambda_cost: 0.1
